
##############################
# Basic
##############################

# 256 色端末を使用する
set -g default-terminal "screen-256color"

# ウィンドウとペインの番号を 1 から開始
set -g base-index 1
setw -g pane-base-index 1
# ウィンドウを閉じた時に番号を詰める
set-option -g renumber-windows on

# ESCの反応を早くする
set -g escape-time 1

# OSC エスケープシーケンスのパススルーを許可する
# (Claude Code の通知フックから Ghostty のデスクトップ通知を出すために必要)
set -g allow-passthrough on

## スクロールバックできる行数
set-option -g history-limit 100000


##############################
# StatusBar
##############################

# 256 COLORS - CHEAT SHEET
# https://jonasjacek.github.io/colors/

# ステータスバーを上部に表示
set-option -g status-position top

# ステータスバーを1秒毎に描画し直す
set -g status-interval 1

# ステータスバーの色を設定する (gray25 = #404040 to match Emacs elscreen)
set-option -g status-bg "#404040"

# status line の文字色を指定する。
set-option -g status-fg "colour255"

# 左右のステータスバーの長さを決定する
set-option -g status-left-length 20
set-option -g status-right-length 20

# status-left のフォーマットを指定する。
set-option -g status-left "#[fg=red]<#S> #[default]"

# status-right のフォーマットを指定する。
set-option -g status-right ""

# window-status のフォーマットを指定する。
# 優先順: 手動リネーム時はその名前 / Claude Code 実行中はタスク要約 (pane_title) /
#         シェルはディレクトリ名 / それ以外はコマンド名 (gray50 to match Emacs elscreen)
# Claude Code は pane_current_command がバージョン文字列 (例 2.1.185) になり、
# pane_title に "✳ <要約>" を出すので、先頭グリフを除去して表示する。
set-window-option -g window-status-format "#[fg=#808080]#I #{?#{==:#{automatic-rename},0},#{=10:window_name},#{?#{m:*.*.*,#{pane_current_command}},#{=16:#{s/^[^ ]* //:pane_title}},#{?#{m:*sh,#{pane_current_command}},#{=10:#{b:pane_current_path}},#{=10:#{pane_current_command}}}}} #[default]"

# カレントウィンドウの window-status のフォーマットを指定する (bright blue-purple)
set-window-option -g window-status-current-format "#[fg=#9999ff,bold]#I #{?#{==:#{automatic-rename},0},#{=10:window_name},#{?#{m:*.*.*,#{pane_current_command}},#{=16:#{s/^[^ ]* //:pane_title}},#{?#{m:*sh,#{pane_current_command}},#{=10:#{b:pane_current_path}},#{=10:#{pane_current_command}}}}} #[default]"

# message表示時のstatus lineの色。dispaly,confirm-before -p などのコマンド出力の色
set -g message-style fg=green,reverse,bg=default

# command-promptでviのノーマルモード時のstatus lineの色。
set -g message-command-style fg=default,bg=default

# コピーモードのときに、右上に出てくる表示の色
set -g mode-style fg=black,bg=colour063

# paneを区切っている線の色
set -g pane-active-border-style fg=#808080,bg=default
set -g pane-border-style fg=#808080,bg=default


##############################
# KeyBinding
##############################

# screen風の終了
set -s command-alias[0] quit='kill-server'

# prefixキーをC-zに変更
set -g prefix C-z

# C-bのキーバインドを解除
unbind C-b
unbind -n C-d

# C-z でサスペンドしないようにする
unbind C-z

# 設定ファイルのリロード
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# ウィンドウの切り替え
bind -n C-M-l next-window
bind -n C-M-h previous-window

# ウィンドウ一覧 (choose-tree) を現在のセッションだけに絞って表示する。
# run-shell 内で #{session_name} は「押下時の現在セッション」に展開され、
# ##{...} はそのまま choose-tree に渡り各行ごとに評価される。
bind w run-shell 'tmux choose-tree -wZf "##{==:##{session_name},#{session_name}}"'

# ウィンドウの削除
bind X confirm-before -p 'kill-window #I? (y/n)' kill-window

# 全ウィンドウの削除（セッション終了）
bind Q confirm-before -p 'kill-session? (y/n)' kill-session

# | でペインを縦分割する
bind | split-window -h

# - でペインを縦分割する
bind - split-window -v

# Prefix + vim のキーバインドでペインを移動する
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Prefix + vim のキーバインドでペインをリサイズする
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# copy設定
set-window-option -g mode-keys emacs
# for mac
if-shell 'type pbcopy' \
  'bind -T copy-mode Enter send-keys -X copy-pipe-and-cancel "pbcopy"'
# for Linux
if-shell 'type xclip' \
  'bind -T copy-mode Enter send -X copy-pipe-and-cancel "xclip -i -selection clipboard > /dev/null 2>&1"'


##############################
# Plugins (TPM)
##############################

# セッションの保存・復元
#   prefix + C-s : 保存
#   prefix + C-r : 復元
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# tmux-continuum: 自動保存(15分間隔)のみ (自動復元は無効)
set -g @continuum-restore 'off'

# TPM初期化 (この行は .tmux.conf の最後に置く)
run '~/.tmux/plugins/tpm/tpm'
